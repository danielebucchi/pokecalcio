<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PokéCalcio</title>
    <meta name="description" content="Manageriale di calcio a 5 con i Pokémon: palestre, Lega e Pokédex di Kanto. Gratis, nel browser." />
    <link rel="canonical" href="https://play.nerdnostalgia.store/" />
    <!-- anteprima dei link condivisi (WhatsApp, Telegram, social): public/og.png, da scripts/make-og.py -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PokéCalcio" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:url" content="https://play.nerdnostalgia.store/" />
    <meta property="og:title" content="PokéCalcio — calcio a 5 con i Pokémon" />
    <meta property="og:description" content="Manageriale di calcio a 5 con i Pokémon: palestre, Lega e Pokédex di Kanto. Gratis, nel browser." />
    <meta property="og:image" content="https://play.nerdnostalgia.store/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PokéCalcio: calcio a 5 con i Pokémon" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PokéCalcio — calcio a 5 con i Pokémon" />
    <meta name="twitter:description" content="Manageriale di calcio a 5 con i Pokémon: palestre, Lega e Pokédex di Kanto. Gratis, nel browser." />
    <meta name="twitter:image" content="https://play.nerdnostalgia.store/og.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#1a1326" />
    <!-- a schermo intero quando è aggiunta alla Home dell'iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PokéCalcio" />
    <script>
      // tema applicato prima del primo disegno, per evitare il lampo chiaro
      document.documentElement.dataset.theme =
        localStorage.getItem('pokecalcio-theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
