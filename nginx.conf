server {
    listen 80;
    root /usr/share/nginx/html;

    # asset con hash nel nome: cache lunga; index.html sempre fresco per prendere i nuovi deploy
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # PWA: il service worker va riletto a ogni visita (così gli aggiornamenti arrivano), il manifest con il suo tipo
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
