server {
    listen 80;
    root /usr/share/nginx/html;

    # asset con hash nel nome: cache lunga; index.html sempre fresco per prendere i nuovi deploy
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
